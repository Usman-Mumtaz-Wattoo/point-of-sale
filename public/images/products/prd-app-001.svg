<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </radialGradient>
    <radialGradient id="appleGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#bgGrad)"/>
  <ellipse cx="100" cy="165" rx="55" ry="12" fill="#b91c1c" opacity="0.15"/>
  <g filter="url(#dropShadow)">
    <!-- Stem -->
    <path d="M100 55 C98 42, 108 32, 114 26" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Leaf -->
    <path d="M102 46 C116 38, 132 44, 130 54 C118 58, 104 54, 102 46 Z" fill="url(#leafGrad)"/>
    <!-- Apple Body -->
    <path d="M72 65 C52 65, 42 85, 42 110 C42 145, 75 160, 95 160 C100 160, 100 158, 105 160 C125 160, 158 145, 158 110 C158 85, 148 65, 128 65 C115 65, 105 72, 100 72 C95 72, 85 65, 72 65 Z" fill="url(#appleGrad)"/>
    <!-- Specular Highlight -->
    <ellipse cx="72" cy="90" rx="14" ry="24" transform="rotate(-25 72 90)" fill="#ffffff" opacity="0.25"/>
  </g>
</svg>