<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bakBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </radialGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="loafShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#bakBg)"/>
  <ellipse cx="100" cy="165" rx="65" ry="12" fill="#78350f" opacity="0.2"/>
  <g filter="url(#loafShadow)">
    <!-- Bread Loaf Oval Body -->
    <ellipse cx="100" cy="115" rx="68" ry="46" fill="url(#crustGrad)"/>
    <!-- Flour dusting top -->
    <ellipse cx="100" cy="100" rx="55" ry="30" fill="#fef3c7" opacity="0.3"/>
    <!-- Sourdough slash cuts -->
    <path d="M60 110 C75 95, 85 95, 95 110" stroke="#fef3c7" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M85 125 C100 110, 110 110, 120 125" stroke="#fef3c7" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M110 110 C125 95, 135 95, 145 110" stroke="#fef3c7" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>